<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarav Raj | Portfolio (Single File)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>

    <!-- React & ReactDOM (via CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (to compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion (via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@11.2.6/dist/framer-motion.js"></script>

    <!-- Tailwind Configuration (Derived from Adobe XD Design System) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        signature: ['"Brush Script MT"', 'cursive'],
                    },
                    colors: {
                        brand: {
                            gold: '#e5b876',
                            goldLight: '#f5d4a1',
                            dark: '#050505',
                            card: '#111111',
                            border: '#222222'
                        }
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        floatCard: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseGlow: {
                            '0%': { transform: 'scale(1)', opacity: '0.5' },
                            '100%': { transform: 'scale(1.2)', opacity: '0.8' },
                        },
                        imgGlow: {
                            '0%': { boxShadow: '0 0 20px rgba(229, 184, 118, 0.1)' },
                            '100%': { boxShadow: '0 0 40px rgba(229, 184, 118, 0.3)' },
                        }
                    },
                    animation: {
                        float: 'float 6s ease-in-out infinite',
                        floatCard: 'floatCard 5s ease-in-out infinite',
                        pulseGlow: 'pulseGlow 8s infinite alternate ease-in-out',
                        imgGlow: 'imgGlow 4s infinite alternate',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Cursor Glow */
        #cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(229, 184, 118, 0.08) 0%, rgba(229, 184, 118, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }
        .glass-card {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
        }
        .skill-card {
            background: rgba(17, 17, 17, 0.8);
            border: 1px solid #222;
            border-radius: 1rem;
        }
        /* Timeline specific CSS that Tailwind doesn't handle easily inline */
        .timeline-line { position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: #333; }
        .timeline-dot { position: absolute; left: 0; top: 6px; width: 13px; height: 13px; border-radius: 50%; background: #e5b876; border: 2px solid #111; box-shadow: 0 0 0 4px rgba(229, 184, 118, 0.2); }
    </style>
</head>
<body class="relative font-sans antialiased bg-brand-dark text-white overflow-x-hidden">
    
    <div id="cursor-glow"></div>
    <div id="root"></div>

    <script type="text/babel">
        // Framer Motion destructuring
        const { motion, AnimatePresence } = window.Motion;

        // --- STRIPE DEMO FUNCTION ---
        // In a real Next.js app, this would be a fetch request to /api/checkout
        const handleStripeCheckout = async () => {
            // NOTE: This is a frontend simulation. Real Stripe requires a backend API route.
            // const stripe = await loadStripe('pk_test_YOUR_PUBLISHABLE_KEY');
            alert("Redirecting to Stripe Checkout...\n\n(In a real Next.js app, this would securely create a checkout session via an API route and redirect the user to Stripe's payment page.)");
            // window.location.href = "https://buy.stripe.com/test_your_payment_link"; 
        };

        // --- COMPONENTS ---

        const Navbar = () => {
            const [isOpen, setIsOpen] = React.useState(false);
            return (
                <nav className="relative z-50 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 flex justify-between items-center border-b border-white/5 bg-brand-dark/80 backdrop-blur-md">
                    <div className="text-2xl font-bold tracking-widest text-white cursor-pointer hover:text-brand-gold transition-colors duration-300">
                        <span className="text-brand-gold">A</span>R
                    </div>
                    
                    <div className="hidden md:flex space-x-8 text-sm text-gray-400 font-medium">
                        {['Home', 'About', 'Skills', 'Projects', 'Experience', 'Contact'].map((item) => (
                            <a key={item} href={`#${item.toLowerCase()}`} className="hover:text-white transition-all duration-300 relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-brand-gold after:transition-all after:duration-300 hover:after:w-full">
                                {item}
                            </a>
                        ))}
                    </div>

                    <button onClick={handleStripeCheckout} className="hidden md:flex items-center gap-2 bg-brand-gold/10 text-brand-gold border border-brand-gold/30 px-5 py-2 rounded-full text-sm font-medium hover:bg-brand-gold hover:text-black transition-all duration-300 transform hover:scale-105">
                        Hire Me <i className="fas fa-arrow-up-right text-xs"></i>
                    </button>
                    
                    <button onClick={() => setIsOpen(!isOpen)} className="md:hidden text-white text-2xl focus:outline-none">
                        <i className={`fas ${isOpen ? 'fa-times' : 'fa-bars'}`}></i>
                    </button>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div 
                                initial={{ height: 0, opacity: 0 }}
                                animate={{ height: 'auto', opacity: 1 }}
                                exit={{ height: 0, opacity: 0 }}
                                className="absolute top-full left-0 w-full bg-[#0a0a0a] border-b border-gray-800 md:hidden overflow-hidden"
                            >
                                <div className="flex flex-col px-6 py-4 space-y-4 text-gray-300">
                                    {['Home', 'About', 'Skills', 'Projects', 'Experience', 'Contact'].map((item) => (
                                        <a key={item} href={`#${item.toLowerCase()}`} onClick={() => setIsOpen(false)} className="hover:text-brand-gold transition-colors">
                                            {item}
                                        </a>
                                    ))}
                                    <button onClick={handleStripeCheckout} className="text-center bg-brand-gold text-black px-5 py-2 rounded-full text-sm font-medium mt-2">
                                        Hire Me
                                    </button>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section className="pt-10 pb-20">
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                        <motion.div 
                            initial={{ opacity: 0, x: -50 }}
                            animate={{ opacity: 1, x: 0 }}
                            transition={{ duration: 0.8 }}
                            className="order-2 lg:order-1"
                        >
                            <p className="text-gray-400 text-lg mb-2">Hello, I'm</p>
                            <h1 className="text-5xl sm:text-6xl md:text-7xl font-bold tracking-tight mb-2">
                                Aarav <span className="text-brand-gold">Raj</span>
                            </h1>
                            <h2 className="text-xl md:text-2xl text-gray-300 font-medium mb-6 h-8">
                                Web Developer & UI/UX Enthusiast
                            </h2>
                            
                            <p className="text-gray-400 max-w-lg mb-8 leading-relaxed">
                                I design and build modern, responsive, and user-focused web experiences that help brands grow and make an impact.
                            </p>

                            <div className="flex flex-col sm:flex-row gap-4 mb-10">
                                <a href="#projects" className="bg-brand-gold text-black px-6 py-3 rounded-full font-semibold hover:bg-brand-goldLight transition-all duration-300 flex items-center justify-center gap-2 transform hover:scale-105">
                                    View My Work <i className="fas fa-arrow-right"></i>
                                </a>
                                <button onClick={handleStripeCheckout} className="border border-gray-600 text-white px-6 py-3 rounded-full font-semibold hover:border-brand-gold hover:text-brand-gold transition-all duration-300 flex items-center justify-center gap-2 transform hover:scale-105">
                                    Hire Me (Stripe) <i className="fas fa-credit-card"></i>
                                </button>
                            </div>

                            <div className="flex gap-5 text-gray-400 text-lg">
                                {['linkedin-in', 'github', 'instagram'].map((icon) => (
                                    <a key={icon} href="#" className="hover:text-brand-gold transition-all duration-300 transform hover:scale-125 hover:-translate-y-1">
                                        <i className={`fab fa-${icon}`}></i>
                                    </a>
                                ))}
                                <a href="#" className="hover:text-brand-gold transition-all duration-300 transform hover:scale-125 hover:-translate-y-1"><i className="fas fa-envelope"></i></a>
                            </div>
                        </motion.div>

                        <motion.div 
                            initial={{ opacity: 0, x: 50 }}
                            animate={{ opacity: 1, x: 0 }}
                            transition={{ duration: 0.8, delay: 0.2 }}
                            className="order-1 lg:order-2 relative flex justify-center lg:justify-end mt-8 lg:mt-0"
                        >
                            <div className="hidden lg:block absolute top-5 right-0 text-right font-signature text-4xl text-brand-gold/60 -rotate-12 pointer-events-none z-10 animate-float">
                                Turning<br/>Ideas into<br/>Real Experiences
                            </div>

                            <div className="relative w-full max-w-sm sm:max-w-md h-[400px] sm:h-[500px] rounded-3xl overflow-hidden border border-gray-800 animate-imgGlow">
                                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=1000&auto=format&fit=crop" alt="Aarav Raj" className="w-full h-full object-cover object-top opacity-90" />
                                <div className="absolute inset-0 bg-gradient-to-t from-brand-dark via-transparent to-transparent"></div>
                            </div>

                            <div className="absolute -bottom-6 right-0 sm:right-4 lg:right-10 glass-card p-4 sm:p-5 w-56 sm:w-64 shadow-xl animate-floatCard">
                                <div className="flex items-center justify-between mb-3 border-b border-gray-800 pb-2">
                                    <span className="text-xl sm:text-2xl font-bold text-brand-gold">2+</span>
                                    <span className="text-[10px] sm:text-xs text-gray-400 text-right leading-tight">Years Experience</span>
                                </div>
                                <div className="flex items-center justify-between mb-3 border-b border-gray-800 pb-2">
                                    <span className="text-xl sm:text-2xl font-bold text-white">20+</span>
                                    <span className="text-[10px] sm:text-xs text-gray-400 text-right leading-tight">Projects Completed</span>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span className="text-xl sm:text-2xl font-bold text-white">10+</span>
                                    <span className="text-[10px] sm:text-xs text-gray-400 text-right leading-tight">Happy Clients</span>
                                </div>
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        const Skills = () => {
            const skillList = [
                { name: 'HTML5', icon: 'fab fa-html5', color: 'text-orange-500', bg: 'bg-orange-500/10' },
                { name: 'CSS3', icon: 'fab fa-css3-alt', color: 'text-blue-500', bg: 'bg-blue-500/10' },
                { name: 'JavaScript', icon: 'fab fa-js', color: 'text-yellow-500', bg: 'bg-yellow-500/10' },
                { name: 'React', icon: 'fab fa-react', color: 'text-cyan-400', bg: 'bg-cyan-500/10' },
                { name: 'Next.js', icon: 'fas fa-n', color: 'text-white', bg: 'bg-white/10' },
                { name: 'Tailwind', icon: 'fas fa-wind', color: 'text-teal-400', bg: 'bg-teal-500/10' },
                { name: 'Node.js', icon: 'fab fa-node-js', color: 'text-green-500', bg: 'bg-green-500/10' },
                { name: 'Stripe', icon: 'fab fa-stripe-s', color: 'text-indigo-400', bg: 'bg-indigo-500/10' },
                { name: 'Framer', icon: 'fas fa-cube', color: 'text-pink-400', bg: 'bg-pink-500/10' },
                { name: 'Figma', icon: 'fab fa-figma', color: 'text-purple-500', bg: 'bg-purple-500/10' },
                { name: 'Adobe XD', icon: 'fas fa-palette', color: 'text-rose-400', bg: 'bg-rose-500/10' },
                { name: 'Git', icon: 'fab fa-git-alt', color: 'text-orange-600', bg: 'bg-orange-600/10' }
            ];

            return (
                <section id="skills" className="py-16">
                    <div className="mb-10">
                        <p className="text-brand-gold text-sm font-semibold tracking-wider mb-3">MY SKILLS</p>
                        <h2 className="text-3xl sm:text-4xl font-bold leading-tight">Tools &<br/>Technologies</h2>
                    </div>

                    <motion.div 
                        initial="hidden"
                        whileInView="visible"
                        viewport={{ once: true, amount: 0.1 }}
                        variants={{
                            hidden: { opacity: 0 },
                            visible: { opacity: 1, transition: { staggerChildren: 0.1 } }
                        }}
                        className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4"
                    >
                        {skillList.map((skill, index) => (
                            <motion.div 
                                key={index}
                                variants={{
                                    hidden: { opacity: 0, scale: 0.8 },
                                    visible: { opacity: 1, scale: 1, transition: { type: 'spring', stiffness: 200 } }
                                }}
                                className="skill-card p-3 sm:p-4 flex flex-col items-center gap-2 sm:gap-3 hover:border-brand-gold hover:-translate-y-1 hover:shadow-lg hover:shadow-brand-gold/20 transition-all duration-300"
                            >
                                <div className={`w-8 h-8 sm:w-10 sm:h-10 rounded-lg ${skill.bg} flex items-center justify-center ${skill.color} text-lg sm:text-xl`}>
                                    <i className={skill.icon}></i>
                                </div>
                                <span className="text-[10px] sm:text-xs text-gray-300 text-center">{skill.name}</span>
                            </motion.div>
                        ))}
                    </motion.div>
                </section>
            );
        };

        const Projects = () => {
            const projects = [
                { title: "Velora - E-commerce Website", desc: "A modern and responsive e-commerce platform with a seamless shopping experience.", img: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1000", tags: ["Next.js", "Tailwind CSS", "Stripe"] },
                { title: "Taskly - Productivity App", desc: "A task management app to help teams collaborate and stay organized.", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1000", tags: ["React", "Node.js", "MongoDB"] },
                { title: "Roamly - Travel Website", desc: "A visually stunning travel website to explore and book unique destinations.", img: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=1000", tags: ["HTML", "CSS", "JavaScript"] }
            ];

            return (
                <section id="projects" className="py-16">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 md:mb-10">
                        <div>
                            <p className="text-brand-gold text-sm font-semibold tracking-wider mb-3">FEATURED PROJECTS</p>
                            <h2 className="text-3xl sm:text-4xl font-bold leading-tight">Some Things<br/>I've Built</h2>
                        </div>
                        <a href="#" className="text-brand-gold text-sm font-medium hover:underline flex items-center gap-2 mt-4 md:mt-0 transition-transform duration-300 hover:translate-x-1">
                            View All Projects <i className="fas fa-arrow-up-right"></i>
                        </a>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {projects.map((proj, idx) => (
                            <motion.div 
                                key={idx}
                                initial={{ opacity: 0, y: 50 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.5, delay: idx * 0.1 }}
                                className="glass-card p-4 group hover:-translate-y-2 hover:shadow-2xl hover:shadow-brand-gold/10 transition-all duration-500"
                            >
                                <div className="rounded-xl overflow-hidden mb-4 h-48 relative">
                                    <img src={proj.img} alt={proj.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                    <div className="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-500"></div>
                                </div>
                                <h3 className="text-lg font-semibold mb-1 group-hover:text-brand-gold transition-colors duration-300">{proj.title}</h3>
                                <p className="text-gray-400 text-xs mb-4 line-clamp-2">{proj.desc}</p>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {proj.tags.map(tag => (
                                        <span key={tag} className="text-[10px] bg-gray-800 text-gray-300 px-2 py-1 rounded transition-colors duration-300 group-hover:bg-brand-gold/20 group-hover:text-brand-gold">{tag}</span>
                                    ))}
                                </div>
                                <a href="#" className="text-brand-gold text-xs font-medium flex items-center gap-1 group-hover:gap-3 transition-all duration-300">
                                    View Project <i className="fas fa-arrow-up-right"></i>
                                </a>
                            </motion.div>
                        ))}
                    </div>
                </section>
            );
        };

        const Experience = () => {
            const jobs = [
                { year: "2023 - Present", role: "Frontend Developer", company: "TechNova Solutions", desc: "Building modern web applications using React, Next.js, and Tailwind CSS." },
                { year: "2022 - 2023", role: "Web Developer Intern", company: "Digital Creators Hub", desc: "Worked on multiple client projects and improved my problem-solving skills." },
                { year: "2021 - 2022", role: "Freelance Web Developer", company: "Self-Employed", desc: "Designed and developed websites for small businesses and startups." }
            ];

            return (
                <section id="experience" className="py-16">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10">
                        <div className="lg:col-span-4">
                            <p className="text-brand-gold text-sm font-semibold tracking-wider mb-3">EXPERIENCE</p>
                            <h2 className="text-3xl sm:text-4xl font-bold leading-tight">My Professional<br/>Journey</h2>
                        </div>
                        <div className="lg:col-span-8 pl-2 sm:pl-4 relative">
                            {jobs.map((job, idx) => (
                                <motion.div 
                                    key={idx}
                                    initial={{ opacity: 0, x: 50 }}
                                    whileInView={{ opacity: 1, x: 0 }}
                                    viewport={{ once: true }}
                                    transition={{ duration: 0.5, delay: idx * 0.2 }}
                                    className="relative pl-6 sm:pl-8 pb-10"
                                >
                                    <div className="timeline-line" style={{ bottom: idx === jobs.length - 1 ? 'auto' : '0', height: idx === jobs.length - 1 ? '20px' : '100%' }}></div>
                                    <div className="timeline-dot" style={{ top: idx === 0 ? '6px' : '10px' }}></div>
                                    <div className="flex flex-col md:flex-row md:items-start gap-2 md:gap-10 transition-transform duration-300 hover:translate-x-2">
                                        <div className="w-32 text-xs sm:text-sm text-brand-gold font-medium pt-1">{job.year}</div>
                                        <div className="flex-1">
                                            <h3 className="text-base sm:text-lg font-semibold text-white">{job.role}</h3>
                                            <p className="text-brand-gold text-xs sm:text-sm mb-2">{job.company}</p>
                                            <p className="text-gray-400 text-xs sm:text-sm">{job.desc}</p>
                                        </div>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            // Cursor Glow Effect
            React.useEffect(() => {
                const glow = document.getElementById('cursor-glow');
                const moveGlow = (e) => {
                    glow.style.left = e.clientX + 'px';
                    glow.style.top = e.clientY + 'px';
                };
                document.addEventListener('mousemove', moveGlow);
                return () => document.removeEventListener('mousemove', moveGlow);
            }, []);

            return (
                <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6">
                    <Navbar />
                    <Hero />
                    <Skills />
                    <Experience />
                    <Projects />
                    {/* Add About, Testimonials, and Contact sections here following the same patterns */}
                    
                    <section id="contact" className="py-10 mb-10">
                        <div className="glass-card p-6 sm:p-8 md:p-12 flex flex-col md:flex-row items-center justify-between gap-8 relative overflow-hidden hover:shadow-2xl hover:shadow-brand-gold/10 transition-shadow duration-500">
                            <div className="relative z-10 max-w-xl text-center md:text-left">
                                <p className="text-brand-gold text-sm font-semibold tracking-wider mb-3">LET'S CONNECT</p>
                                <h2 className="text-3xl sm:text-4xl md:text-5xl font-bold mb-4">Have a Project<br/>in Mind?</h2>
                                <p className="text-gray-400 text-sm max-w-md mx-auto md:mx-0">
                                    I'm always open to discussing new opportunities, interesting projects, or just a friendly chat.
                                </p>
                            </div>
                            <div className="relative z-10 flex flex-col sm:flex-row items-center gap-4">
                                <button onClick={handleStripeCheckout} className="bg-brand-gold text-black px-6 sm:px-8 py-3 sm:py-4 rounded-full font-semibold hover:bg-brand-goldLight transition-all duration-300 flex items-center justify-center gap-2 whitespace-nowrap w-full sm:w-auto transform hover:scale-105">
                                    Get In Touch <i className="fas fa-arrow-right"></i>
                                </button>
                                <div className="text-brand-gold text-3xl transform -rotate-12 opacity-80 hidden sm:block animate-bounce">
                                    <i className="fas fa-paper-plane"></i>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    <footer className="text-center py-6 text-xs text-gray-600 border-t border-gray-900 mt-10">
                        &copy; 2026 Aarav Raj. All rights reserved.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
